[package]
name = "erindi-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
process-wrap = { version = "10.0.0", features = ["tokio1", "job-object", "process-group", "kill-on-drop", "creation-flags"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7.19", features = ["codec"], default-features = false }
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
