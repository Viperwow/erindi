[package]
name = "whispio-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "whispio_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
whispio-audio-asr = { version = "0.1.0", path = "../../../crates/audio-asr" }
whispio-core = { version = "0.1.0", path = "../../../crates/core" }
