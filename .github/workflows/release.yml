name: Release

# Every merge into main publishes a Windows build as the rolling "latest" pre-release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its libraries into target/, which rust-cache does not keep while it
      # keeps the build script marked as done. Providing SHERPA_ONNX_LIB_DIR avoids that dependency.
      - name: Locate sherpa-onnx libraries
        id: sherpa
        run: |
          $line = (Select-String -Path Cargo.lock -Pattern '^name = "sherpa-onnx-sys"$' -Context 0,1).Context.PostContext[0]
          $v = $line -replace '.*"(.*)".*', '$1'
          "version=$v" >> $env:GITHUB_OUTPUT
          "SHERPA_ONNX_LIB_DIR=$env:RUNNER_TEMP\sherpa-onnx\sherpa-onnx-v$v-win-x64-shared-MT-Release-lib\lib" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ steps.sherpa.outputs.version }}
      - name: Download sherpa-onnx libraries
        run: |
          if (-not (Test-Path $env:SHERPA_ONNX_LIB_DIR)) {
            $v = "${{ steps.sherpa.outputs.version }}"
            $name = "sherpa-onnx-v$v-win-x64-shared-MT-Release-lib.tar.bz2"
            $dir = "$env:RUNNER_TEMP\sherpa-onnx"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$name" -OutFile "$dir\$name"
            tar -xjf "$dir\$name" -C $dir
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle
      - name: Package
        run: ./scripts/package.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest dist/*.zip --prerelease --target ${{ github.sha }} --title "Latest build" --notes "Built from ${{ github.sha }}. Work in progress; replaced on every merge into main."
