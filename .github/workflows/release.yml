name: Release

# Every merge into main publishes a Windows build as the rolling "latest" pre-release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-cache drops target/sherpa-onnx-prebuilt but keeps the build script as done,
      # so the linker would miss the prebuilt sherpa-onnx libraries.
      - uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rerun the sherpa-onnx build script when its libraries are missing
        run: |
          if (-not (Test-Path target/sherpa-onnx-prebuilt)) {
            Remove-Item -Recurse -Force target/*/build/sherpa-onnx-sys-*, target/*/.fingerprint/sherpa-onnx-sys-* -ErrorAction SilentlyContinue
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle
      - name: Package
        run: ./scripts/package.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest dist/*.zip --prerelease --target ${{ github.sha }} --title "Latest build" --notes "Built from ${{ github.sha }}. Work in progress; replaced on every merge into main."
