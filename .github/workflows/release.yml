name: Release

# Every merge into main publishes a Windows build as the rolling "latest" pre-release.
# A feat or fix since the last tag also makes a vX.Y.Z release that keeps its own build.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# A cancelled run could leave a new vX.Y.Z release without its build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit carries the new version numbers.
          ref: ${{ needs.version.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its libraries into target/, which rust-cache does not keep while it
      # keeps the build script marked as done. Providing SHERPA_ONNX_LIB_DIR avoids that dependency.
      - name: Locate sherpa-onnx libraries
        id: sherpa
        run: |
          $line = (Select-String -Path Cargo.lock -Pattern '^name = "sherpa-onnx-sys"$' -Context 0,1).Context.PostContext[0]
          $v = $line -replace '.*"(.*)".*', '$1'
          "version=$v" >> $env:GITHUB_OUTPUT
          "SHERPA_ONNX_LIB_DIR=$env:RUNNER_TEMP\sherpa-onnx\sherpa-onnx-v$v-win-x64-shared-MT-Release-lib\lib" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ steps.sherpa.outputs.version }}
      - name: Download sherpa-onnx libraries
        run: |
          if (-not (Test-Path $env:SHERPA_ONNX_LIB_DIR)) {
            $v = "${{ steps.sherpa.outputs.version }}"
            $name = "sherpa-onnx-v$v-win-x64-shared-MT-Release-lib.tar.bz2"
            $dir = "$env:RUNNER_TEMP\sherpa-onnx"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$name" -OutFile "$dir\$name"
            tar -xjf "$dir\$name" -C $dir
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle
      - name: Package
        run: ./scripts/package.ps1
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          gh release delete latest --cleanup-tag --yes 2>$null
          gh release create latest dist/erindi-*.zip --prerelease --target ${{ github.sha }} --title "Erindi $version (latest build)" --notes "Erindi $version, built from ${{ github.sha }}. Work in progress; replaced on every merge into main."
      - name: Attach to the version release
        if: needs.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.version.outputs.tag }} dist/erindi-*.zip
