name: Release

# Every merge into main publishes Windows and macOS builds as the rolling "latest" pre-release.
# A feat or fix since the last tag also makes a vX.Y.Z release that keeps its own builds.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

# A cancelled run could leave a new vX.Y.Z release without its build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release commit carries the new version numbers.
          ref: ${{ needs.version.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its libraries into target/, which rust-cache does not keep while it
      # keeps the build script marked as done. Providing SHERPA_ONNX_LIB_DIR avoids that dependency.
      - name: Locate sherpa-onnx libraries
        id: sherpa
        run: |
          $line = (Select-String -Path Cargo.lock -Pattern '^name = "sherpa-onnx-sys"$' -Context 0,1).Context.PostContext[0]
          $v = $line -replace '.*"(.*)".*', '$1'
          "version=$v" >> $env:GITHUB_OUTPUT
          "SHERPA_ONNX_LIB_DIR=$env:RUNNER_TEMP\sherpa-onnx\sherpa-onnx-v$v-win-x64-shared-MT-Release-lib\lib" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ steps.sherpa.outputs.version }}
      - name: Download sherpa-onnx libraries
        run: |
          if (-not (Test-Path $env:SHERPA_ONNX_LIB_DIR)) {
            $v = "${{ steps.sherpa.outputs.version }}"
            $name = "sherpa-onnx-v$v-win-x64-shared-MT-Release-lib.tar.bz2"
            $dir = "$env:RUNNER_TEMP\sherpa-onnx"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$name" -OutFile "$dir\$name"
            tar -xjf "$dir\$name" -C $dir
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --no-bundle
      - name: Package
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/erindi-*.zip

  build-macos:
    needs: version
    strategy:
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { arch: x64, runner: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: scripts/fetch-llama-macos.sh ${{ matrix.arch }}
      - name: Build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg "dist/erindi-$version-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/erindi-*.dmg

  publish:
    needs: [version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --prerelease --target ${{ github.sha }} --title "Erindi $version (latest build)" --notes-file - <<EOF
          Erindi $version, built from ${{ github.sha }}. Work in progress; replaced on every merge into main.

          **macOS:** Erindi is not notarized by Apple, so macOS blocks its first launch. Open System Settings → Privacy & Security and click **Open Anyway**.
          EOF
      - name: Attach to the version release
        if: needs.version.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.version.outputs.tag }} dist/*
